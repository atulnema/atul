<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GA4 for SEO</title>
<!--
  "How to use Google Analytics 4 for SEO": a 45-second vertical film (1080x1920).
  Built on the motion engine's drawing core. Scene timing comes from ga4-seo.timing.js,
  which the voiceover script writes, so every visual beat lands on the spoken word.

  Same contract as motion.html: window.seek(seconds), ?render, ?t=, window.motionInfo.
  Export: npm run motion -- --page motion/films/ga4-seo.html --size 1080x1920 --audio motion/films/ga4-seo.vo.wav
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050507; color: #F2EFE9; font: 14px/1.4 Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: grid; place-items: center; padding: 16px; min-height: 0; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #ui { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid #1C1C26; background: #0B0B10; }
  #ui button { background: #121219; color: inherit; border: 1px solid #2A2A36; border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; }
  #scrub { flex: 1; accent-color: #C8FF4D; }
  #time { font-variant-numeric: tabular-nums; color: #9A98A6; min-width: 110px; }
  body.render { background: transparent; }
  body.render #ui { display: none; }
  body.render #stage { padding: 0; place-items: start; }
  body.render canvas { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="45" step="0.001" value="0" aria-label="Timeline" />
  <span id="time">0.00s</span>
</div>
<audio id="vo" src="ga4-seo.vo.wav" preload="auto"></audio>
<script src="ga4-seo.timing.js"></script>
<script>
"use strict";
const DUR = 8, MOVE = 2.2, RET = 6.6;
const THEMES = {
  alphastrix: { ground: "#07070A", surface: "#121219", surface2: "#1C1C26", ink: "#F2EFE9",
    muted: "#9A98A6", a1: "#C8FF4D", a2: "#7C5CFF", border: "rgba(242,239,233,0.10)" },
};
const FONT = '"Inter Tight", Inter, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif';
const Q = new URLSearchParams(location.search);
const RENDER = Q.has("render");

/* ── Drawing core, shared with motion.html ── */
/* ───────────────────────── Math ───────────────────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

function cubicBezier(x1, y1, x2, y2) {

  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;

  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x, d = dx(t);
      if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    if (Math.abs(sx(t) - x) > 1e-4) {           // Newton stalled: bisect
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { (sx(t) < x ? (lo = t) : (hi = t)); t = (lo + hi) / 2; }
    }
    return sy(t);
  };
}
// The house curve: fast out of the gate, long soft landing. No overshoot.
const ease = cubicBezier(0.16, 1, 0.3, 1);

// 0 → 1 during the move, 1 through the hold, 1 → 0 during the return.
function amt(t, dIn = 0, dOut = 0, inDur = MOVE - dIn, outDur = DUR - RET - dOut) {
  const a = ease(clamp((t - dIn) / inDur));

}
// Hold envelope: fades micro-motion in and out so nothing pops at 2.2s or 6.6s.
function env(t, fade = 0.6) { return smooth(clamp((t - MOVE) / fade)) * smooth(clamp((RET - t) / fade)); }
// Damped spring, only used where an effect explicitly asks for overshoot (07).
function spring(x, w = 9, z = 0.55) {
  if (x <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
function rng(seed) {                            // mulberry32: same seed, same frame
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

/* ───────────────────────── Colour ───────────────────────── */
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function mix(h1, h2, k, a = 1) {
  const A = rgb(h1), B = rgb(h2);
  return `rgba(${Math.round(lerp(A[0], B[0], k))},${Math.round(lerp(A[1], B[1], k))},${Math.round(lerp(A[2], B[2], k))},${a})`;
}

/* ───────────────────────── Canvas state ───────────────────────── */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 1080, H = 1080, U = 1, CX = 540, CY = 540, T = THEMES.alphastrix;
let grainPattern = null;

function setup(size, brand) {
  const m = /^(\d{3,4})x(\d{3,4})$/.exec(size || "") || [0, 1080, 1080];
  W = +m[1]; H = +m[2]; U = Math.min(W, H) / 1080; CX = W / 2; CY = H / 2;
  T = THEMES[brand] || THEMES.alphastrix;
  canvas.width = W; canvas.height = H;
  // Static film grain, generated once from a fixed seed.
  const g = document.createElement("canvas"); g.width = g.height = 192;
  const gx = g.getContext("2d"), img = gx.createImageData(192, 192), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gx.putImageData(img, 0, 0);
  grainPattern = ctx.createPattern(g, "repeat");
  fitCanvas();
}

/* ───────────────────────── Drawing helpers ───────────────────────── */
const font = (size, weight = 600) => `${weight} ${size}px ${FONT}`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function txt(s, x, y, o = {}) {
  const { size = 32, weight = 600, color = T.ink, align = "left", base = "alphabetic", track = 0, alpha = 1 } = o;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = `${track}px`;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 600, track = 0) {
  ctx.save(); ctx.font = font(size, weight); ctx.letterSpacing = `${track}px`;
  const m = ctx.measureText(s); ctx.restore(); return m;
}
function fitSize(s, maxW, size, weight = 600, trackEm = 0) {
  const w = measure(s, size, weight, size * trackEm).width;
  return w > maxW ? size * maxW / w : size;
}
function wrap(s, maxW, size, weight = 400) {
  ctx.save(); ctx.font = font(size, weight);
  const lines = []; let line = "";
  for (const word of s.split(" ")) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; } else line = test;

}

  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = `rgba(0,0,0,${0.5 * shadow})`; ctx.shadowBlur = 50 * U; ctx.shadowOffsetY = 22 * U;
  rr(x, y, w, h, r); ctx.fillStyle = rgba(fill, 0.94); ctx.fill();

  sheen.addColorStop(0, "rgba(255,255,255,0.055)"); sheen.addColorStop(0.45, "rgba(255,255,255,0)");

    ctx.strokeStyle = rgba(T.a1, 0.75 * glow); ctx.shadowColor = rgba(T.a1, 0.55 * glow); ctx.shadowBlur = 26 * U;
    ctx.lineWidth = 1.5 * U; ctx.stroke(); ctx.shadowColor = "transparent";

  const rim = ctx.createLinearGradient(x, 0, x + w, 0);
  rim.addColorStop(0, "rgba(255,255,255,0)"); rim.addColorStop(0.5, "rgba(255,255,255,0.32)"); rim.addColorStop(1, "rgba(255,255,255,0)");
  ctx.beginPath(); ctx.moveTo(x + r, y + 0.5); ctx.lineTo(x + w - r, y + 0.5);
  ctx.strokeStyle = rim; ctx.lineWidth = Math.max(1, U); ctx.stroke();
  ctx.restore();
}
function pill(label, x, y, o = {}) {
  const { size = 20 * U, fill = T.surface2, color = T.ink, border = T.border, alpha = 1, align = "left", weight = 600 } = o;
  const padX = size * 0.75, h = size * 1.9, w = measure(label, size, weight).width + padX * 2;
  const left = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(left, y, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = Math.max(1, U); ctx.stroke(); }
  txt(label, left + padX, y + h / 2, { size, weight, color, base: "middle" });
  ctx.restore();
  return { w, h, left };
}
function background() {
  ctx.fillStyle = T.ground; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(W * 0.2, H * 0.1, 0, W * 0.2, H * 0.1, Math.max(W, H) * 0.7);
  g.addColorStop(0, rgba(T.a2, 0.10)); g.addColorStop(1, rgba(T.a2, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W * 0.9, H * 0.95, 0, W * 0.9, H * 0.95, Math.max(W, H) * 0.6);
  g.addColorStop(0, rgba(T.a1, 0.05)); g.addColorStop(1, rgba(T.a1, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Faint grid with a soft radial falloff
  ctx.save();
  ctx.strokeStyle = rgba(T.ink, 0.035); ctx.lineWidth = 1;
  const step = 72 * U;
  ctx.beginPath();
  for (let x = (W % step) / 2; x < W; x += step) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); }
  for (let y = (H % step) / 2; y < H; y += step) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); }
  ctx.stroke();
  const v = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.25, CX, CY, Math.max(W, H) * 0.75);
  v.addColorStop(0, rgba(T.ground, 0)); v.addColorStop(1, rgba(T.ground, 0.92));
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function grain() {
  ctx.save(); ctx.globalAlpha = 0.045; ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function illustrativeTag() {
  pill("Illustrative Data", W - 36 * U, 36 * U, { size: 17 * U, align: "right", color: T.muted, fill: rgba(T.ground, 0.6), weight: 500 });
}
// Polyline helpers for partial strokes and travelling pulses
function lengths(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return L; }
function pointAt(pts, L, d) {
  d = clamp(d, 0, L[L.length - 1]);
  let i = 1; while (i < L.length - 1 && L[i] < d) i++;
  const k = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1);
  return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
}
function strokePartial(pts, L, upTo) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (L[i] >= upTo) { const p = pointAt(pts, L, upTo); ctx.lineTo(p[0], p[1]); break; }
    ctx.lineTo(pts[i][0], pts[i][1]);
  }

}
// Monotone cubic interpolation: a smooth curve that never overshoots a data point.
function monotone(xs, ys, per = 28) {

  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);

  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;

  for (let i = 0; i < n - 1; i++) {

function glowDot(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba("#FFFFFF", a)); g.addColorStop(0.25, rgba(color, 0.9 * a)); g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
const fmt = v => (typeof v === "number" ? v.toLocaleString("en-US") : String(v));

// Brand mark (same paths as app/icon.svg). Glyph spans 5→27 in a 32-unit box.
const LOGO_A = new Path2D("M16 5 27 27H21L16 17 11 27H5L16 5Z");
const LOGO_B = new Path2D("M16 5 27 27H21L16 17Z");
function drawLogo(c, x, y, size, alpha = 1) {
  const s = size / 22;
  c.save(); c.globalAlpha *= alpha; c.translate(x - 16 * s, y - 16 * s); c.scale(s, s);
  c.fillStyle = T.a1; c.fill(LOGO_A);
  c.globalAlpha *= 0.85; c.fillStyle = T.a2; c.fill(LOGO_B);
  c.restore();
}
function logoClip(x, y, size) {
  const s = size / 22, p = new Path2D(), m = new DOMMatrix().translate(x - 16 * s, y - 16 * s).scale(s);
  p.addPath(LOGO_A, m); return p;
}



/* ═════════════════════════ FILM ═════════════════════════ */
// Fallback timing so the page still previews before the voiceover exists.
const TIMING = window.FILM_TIMING || (() => {
  const lens = { hook: 6, gsc: 11, organic: 5, landing: 5, engage: 6, keyevents: 6.5, cta: 5.5 };
  let t = 0; const scenes = [];
  for (const [id, d] of Object.entries(lens)) { scenes.push({ id, start: t, end: t + d, lines: [] }); t += d; }
  return { total: t, scenes };
})();
const FILM = TIMING.total;

const X0 = 72;                       // side margin (px at 1080 wide)
const KEYWORDS = ["Google Analytics 4", "Search Console", "Product links", "Admin", "Traffic acquisition", "Organic Search",
  "Landing page", "engagement rate", "key events", "form submissions", "Alphastrix Digital", "SEO", "leads", "rewrite"];

// When is a phrase spoken? Sentence timings are exact; position inside a sentence is estimated by characters.
function cue(s, phrase, fallback = 0) {
  for (const l of s.lines) {
    const i = l.text.indexOf(phrase);
    if (i >= 0) return l.start + (l.end - l.start) * (i / l.text.length) - s.start;
  }
  return fallback;
}
const rise = (lt, at, dur = 0.6) => ease(clamp((lt - at) / dur));

function check(x, y, s, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3.2 * s / 20; ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.12, y + s * 0.32); ctx.lineTo(x + s * 0.5, y - s * 0.35); ctx.stroke(); ctx.restore();
}
function chip(label, x, y, o = {}) { return pill(label, x, y, { size: 24, ...o }); }
function crumbs(parts, y, lt, at) {
  const a = rise(lt, at, 0.5);
  if (a <= 0) return;
  const s = 22, gap = 14, sepW = measure("›", s, 500).width;
  const ws = parts.map(p => measure(p, s, 500).width + s * 1.5);
  const total = ws.reduce((a, b) => a + b, 0) + (parts.length - 1) * (sepW + gap * 2);
  let x = CX - total / 2;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 16);
  parts.forEach((p, i) => {
    pill(p, x, y, { size: s, weight: 500, color: T.muted, fill: rgba(T.ink, 0.04) });
    x += ws[i];
    if (i < parts.length - 1) { txt("›", x + gap, y + s * 0.95, { size: s, color: T.muted, base: "middle", weight: 500 }); x += sepW + gap * 2; }

function header(step, title, lt) {
  const a = rise(lt, 0.05, 0.6), b = rise(lt, 0.18, 0.7);
  txt(`STEP 0${step}`, X0, 380 + (1 - a) * 20, { size: 26, color: T.a1, weight: 700, track: 4, alpha: a });
  txt("/ 05", X0 + measure(`STEP 0${step}`, 26, 700, 4).width + 14, 380 + (1 - a) * 20, { size: 26, color: T.muted, weight: 500, track: 4, alpha: a });

function topBar(t) {

  // Step progress: five segments that fill as the steps go by

  ids.forEach((id, i) => {

}
function tableCard(x, y, w, cols, rows, lt, at, o = {}) {
  // cols: [{label, x (fraction), align}] ; rows: arrays of strings

  ctx.fillStyle = rgba(T.ink, 0.08); ctx.fillRect(x + 28, y + headH, w - 56, 1);

      const X = q * q * p.ox + 2 * q * e * p.cx + e * e * p.tx, Y = q * q * p.oy + 2 * q * e * p.cy + e * e * p.ty;

      ctx.fillRect(X - p.sz / 2, Y - p.sz / 2, p.sz, p.sz);
    }
    if (solid > 0) {
      drawLogo(ctx, this.lx, this.ly, this.size, solid);
      const k = clamp((lt - 1.9) / 1.6);
      if (k > 0 && k < 1) {
        ctx.save(); ctx.clip(logoClip(this.lx, this.ly, this.size)); ctx.globalCompositeOperation = "lighter";
        const sx = lerp(this.lx - this.size, this.lx + this.size, ease(k)), g = ctx.createLinearGradient(sx - 80, this.ly - this.size, sx + 80, this.ly + this.size);
        g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, `rgba(255,255,255,${0.5 * Math.sin(Math.PI * k)})`); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
      }
    }
    const q = rise(lt, cue(s, "Want this", 0.2) + 0.6, 0.7), b = rise(lt, cue(s, "Talk to", 1.8) - 0.1, 0.7), h = rise(lt, cue(s, "Talk to", 1.8) + 0.5, 0.6);
    txt("Want GA4 set up for SEO?", CX, 1080 + (1 - q) * 20, { size: 40, weight: 500, color: T.muted, align: "center", alpha: q });
    txt("Alphastrix Digital", CX, 1170 + (1 - b) * 24, { size: fitSize("Alphastrix Digital", W - X0 * 2, 92, 700, -0.03), weight: 700, align: "center", alpha: b, track: -2.5 });
    if (h > 0) {
      ctx.save(); ctx.globalAlpha *= h; ctx.translate(0, (1 - h) * 14);
      pill("DM us on Instagram  @alphastrix_", CX, 1222, { size: 28, align: "center", color: T.ground, fill: T.a1, border: null, weight: 700 });
      ctx.restore();
    }
  },
};

/* ── Captions ── */
function chunks(line) {
  const words = line.text.split(" "), out = []; let cur = [];
  const flush = () => { if (cur.length) out.push(cur.join(" ")); cur = []; };
  for (const w of words) {
    cur.push(w);
    const len = cur.join(" ").length;
    if (len > 22 || (/[,.?!]$/.test(w) && len > 9)) flush();
  }
  flush();
  // Merge a dangling one-word tail into the previous chunk
  if (out.length > 1 && !out[out.length - 1].includes(" ")) out[out.length - 2] += " " + out.pop();
  const total = out.reduce((a, c) => a + c.length + 1, 0); let acc = 0;
  return out.map(c => { const s = line.start + (line.end - line.start) * acc / total; acc += c.length + 1; return { text: c, start: s, end: line.start + (line.end - line.start) * acc / total }; });
}
let CAPTIONS = [];
function buildCaptions() { CAPTIONS = TIMING.scenes.flatMap(s => s.lines.flatMap(chunks)); }
function drawCaption(t) {
  const c = CAPTIONS.find(c => t >= c.start - 0.05 && t < c.end + 0.12) || null;
  if (!c) return;
  const a = smooth(clamp((t - c.start + 0.05) / 0.12)), size = 54, y = 1555 + (1 - a) * 10;
  // Split into keyword / plain segments so keywords can be lit
  const segs = []; let rest = c.text;
  while (rest.length) {
    let best = null;
    for (const k of KEYWORDS) { const i = rest.indexOf(k); if (i >= 0 && (!best || i < best.i)) best = { i, k }; }
    if (!best) { segs.push([rest, false]); break; }
    if (best.i > 0) segs.push([rest.slice(0, best.i), false]);
    segs.push([best.k, true]); rest = rest.slice(best.i + best.k.length);
  }
  const fitted = fitSize(c.text, W - X0 * 2, size, 800, -0.01);
  const widths = segs.map(([s]) => measure(s, fitted, 800, -0.01 * fitted).width), total = widths.reduce((a, b) => a + b, 0);
  let x = CX - total / 2;
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3;
  segs.forEach(([s, hot], i) => { txt(s, x, y, { size: fitted, weight: 800, color: hot ? T.a1 : T.ink, track: -0.01 * fitted }); x += widths[i]; });
  ctx.restore();
}

/* ── Runtime ── */
let ready = Promise.resolve();
function fitCanvas() {
  if (RENDER) { canvas.style.width = W + "px"; canvas.style.height = H + "px"; return; }
  const r = document.getElementById("stage").getBoundingClientRect(), s = Math.min((r.width - 32) / W, (r.height - 32) / H, 1);
  canvas.style.width = W * s + "px"; canvas.style.height = H * s + "px";
}
addEventListener("resize", fitCanvas);

function renderFrame(t) {
  t = clamp(t, 0, FILM - 1e-6);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  background();
  const i = TIMING.scenes.findIndex(s => t >= s.start && t < s.end), s = TIMING.scenes[Math.max(0, i)];
  const lt = t - s.start, D = s.end - s.start, last = i === TIMING.scenes.length - 1;
  // Scene envelope: quick fade and drift between scenes. The first frame is fully drawn (it's the preview frame).
  const inA = s.start === 0 ? 1 : smooth(clamp(lt / 0.3)), outA = last ? 1 : smooth(clamp((D - lt) / 0.28));
  ctx.save(); ctx.globalAlpha = inA * outA; ctx.translate(0, (1 - inA) * 30 - (1 - outA) * 30);
  SCENES[s.id].draw(lt, D, s);
  ctx.restore();
  topBar(t);
  drawCaption(t);
  grain();
  ctx.restore();
}
window.seek = async sec => { await ready; renderFrame(+sec || 0); return sec; };

(async () => {
  setup(Q.get("size") || "1080x1920", "alphastrix");
  if (RENDER) document.body.classList.add("render");
  ready = (async () => { await document.fonts.ready; for (const s of Object.values(SCENES)) if (s.init) await s.init(); buildCaptions(); })();
  await ready;
  window.motionInfo = { duration: FILM, width: W, height: H, effect: "ga4-seo", effects: ["ga4-seo"], loop: false };
  if (RENDER) { renderFrame(+Q.get("t") || 0); window.__motionReady = true; return; }

  const $ = id => document.getElementById(id), scrub = $("scrub"), vo = $("vo");
  scrub.max = FILM;
  let playing = !Q.has("t"), t = +Q.get("t") || 0, last = performance.now();
  const setPlaying = p => {
    playing = p; $("play").textContent = p ? "Pause" : "Play"; last = performance.now();
    if (p) { vo.currentTime = t; vo.play().catch(() => {}); } else vo.pause();
  };
  $("play").onclick = () => setPlaying(!playing);
  scrub.oninput = () => { setPlaying(false); t = +scrub.value; };
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); } });
  const loop = now => {
    if (playing) { t += (now - last) / 1000; if (t >= FILM) { t = 0; vo.currentTime = 0; } }
    last = now; renderFrame(t); scrub.value = t; $("time").textContent = `${t.toFixed(2)}s / ${FILM.toFixed(2)}s`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
