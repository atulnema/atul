[project]
name = "edge-tts-mcp"
version = "0.1.1+patched"
description = "Edge TTS MCP server (patched fork of eraincc/edge-tts-mcp)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.3,<2",
    "edge-tts>=7.2",
    "nest-asyncio==1.6.0",
]

[project.scripts]
edge_tts_mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
